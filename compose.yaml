services:
  db:
    build:
      context: ./database
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_DB_FILE: /run/secrets/db_name
    secrets: 
      - db_password
      - db_user
      - db_name

  app:
    image: ghcr.io/${GITHUB_OWNER:-owner}/${GITHUB_REPO:-repo}-app:latest
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_USER_FILE: /run/secrets/db_user
      DB_NAME_FILE: /run/secrets/db_name
      DB_HOST: db
      REDIS_HOST: redis
    secrets:
      - db_password
      - db_user
      - db_name
    depends_on:
       - db
       - redis
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: ghcr.io/${GITHUB_OWNER:-owner}/${GITHUB_REPO:-repo}-html:latest
    build:
      context: ./html
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./html/conf.d:/etc/nginx/conf.d:ro
      - ./html/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:latest
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  certbot:
    image: certbot/dns-cloudflare:latest
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./secrets/cloudflare.ini:/etc/letsencrypt/cloudflare.ini:ro
    command: >
      certonly 
      --dns-cloudflare
      --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini
      --dns-cloudflare-propagation-seconds 30
      --non-interactive 
      --keep-until-expiring 
      --agree-tos 
      --register-unsafely-without-email 
      -d "2jz.space" 

  certbot-renew:
    # Removed docker socket mount for security. Use the host systemd timer
    # or cron to run renewal commands (see docs/systemd.md) instead of
    # granting the container access to the Docker socket.
    image: alpine:3.18
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/workspace/certbot/conf:rw
      - ./secrets/cloudflare.ini:/workspace/secrets/cloudflare.ini:ro
      - ./certbot/renew-loop.sh:/workspace/certbot/renew-loop.sh:ro
    working_dir: /workspace
    entrypoint: ["/bin/sh", "/workspace/certbot/renew-loop.sh"]

secrets:
  db_password:
    file: secrets/db_password
  db_user:
    file: secrets/db_user
  db_name:
    file: secrets/db_name

volumes:
  db_data:
  redis_data:
