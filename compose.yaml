services:
  db:
    build:
      context: ./database
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_DB_FILE: /run/secrets/db_name
    secrets: 
      - db_password
      - db_user
      - db_name

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_USER_FILE: /run/secrets/db_user
      DB_NAME_FILE: /run/secrets/db_name
      DB_HOST: db
      REDIS_HOST: redis
    secrets:
      - db_password
      - db_user
      - db_name
    depends_on:
       - db
       - redis

  nginx:
    build:
      context: ./html
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./html/conf.d:/etc/nginx/conf.d:ro
      - ./html/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - app

  redis:
    image: redis:latest
    restart: unless-stopped

  certbot:
    image: certbot/dns-cloudflare:latest
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./secrets/cloudflare.ini:/etc/letsencrypt/cloudflare.ini:ro
    command: >
      certonly 
      --test-cert
      --dns-cloudflare
      --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini
      --dns-cloudflare-propagation-seconds 30
      --non-interactive 
      --keep-until-expiring 
      --agree-tos 
      --register-unsafely-without-email 
      -d "2jz.space" 

secrets:
  db_password:
    file: secrets/db_password
  db_user:
    file: secrets/db_user
  db_name:
    file: secrets/db_name

volumes:
  db_data: